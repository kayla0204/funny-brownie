<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureFudge - Melt-in-Your-Mouth Brownie Bites</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Reset & Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #FFF9F2; color: #3E2723; scroll-behavior: smooth; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 10%; background-color: rgba(255, 249, 242, 0.95); position: fixed; width: 100%; top: 0; z-index: 100; backdrop-filter: blur(5px); border-bottom: 1px solid rgba(62, 39, 35, 0.05); }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 800; color: #3E2723; text-decoration: none; }
        .nav-links { list-style: none; display: flex; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: #3E2723; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: #E0A96D; }
        .nav-cta { background-color: #3E2723; color: #FFF9F2 !important; padding: 8px 18px; border-radius: 20px; }
        .nav-cta:hover { background-color: #E0A96D !important; color: #3E2723 !important; }

        /* Hero Section */
        .hero { display: flex; align-items: center; min-height: 100vh; padding: 140px 10% 80px 10%; gap: 50px; }
        .hero-content { flex: 1.2; }
        .hero-content h1 { font-family: 'Playfair Display', serif; font-size: 52px; line-height: 1.2; margin-bottom: 20px; }
        .hero-content span { color: #E0A96D; }
        .hero-content p { font-size: 16px; line-height: 1.6; margin-bottom: 30px; color: #5C4033; }
        .cta-btn { display: inline-block; padding: 15px 35px; background-color: #3E2723; color: #FFF9F2; text-decoration: none; font-weight: 600; border-radius: 30px; transition: 0.3s; box-shadow: 0 4px 15px rgba(62,39,35,0.2); text-align: center; }
        .cta-btn:hover { background-color: #E0A96D; color: #3E2723; transform: translateY(-2px); }
        .hero-image { flex: 0.8; text-align: center; }
        .hero-image img { max-width: 100%; height: auto; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        /* Global Section Header */
        .section-header { text-align: center; max-width: 700px; margin: 0 auto 50px auto; }
        .section-header h2 { font-family: 'Playfair Display', serif; font-size: 38px; color: #3E2723; margin-bottom: 15px; font-weight: 800; }
        .section-header p { color: #705446; font-size: 16px; line-height: 1.6; }

        /* Features Section */
        .features { padding: 80px 10%; background-color: #F5EBE0; text-align: center; }
        .features h2 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 50px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .feature-card { background: #FFF9F2; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.02); }
        .feature-card h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 15px; }
        .feature-card p { font-size: 14px; line-height: 1.6; color: #5C4033; }

        /* Product Highlight (Bite Size) */
        .product-highlight { display: flex; align-items: center; padding: 100px 10%; gap: 60px; }
        .highlight-img { flex: 1; }
        .highlight-img img { width: 100%; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); }
        .highlight-text { flex: 1; }
        .highlight-text h2 { font-family: 'Playfair Display', serif; font-size: 38px; margin-bottom: 20px; }
        .highlight-text p { font-size: 16px; line-height: 1.6; margin-bottom: 25px; }

        /* Varian Menu Section (Lebar Full Web & Menyamping) */
        .menu-section { width: 100%; padding: 100px 5%; background-color: #FFF9F2; box-sizing: border-box; }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; width: 100%; max-width: 1300px; margin: 0 auto; }
        .menu-card { background: #FFFFFF; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(62,39,35,0.03); transition: 0.3s; border: 1px solid rgba(62,39,35,0.02); text-align: center; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(62,39,35,0.08); }
        .menu-img-box { height: 250px; width: 100%; overflow: hidden; background-color: #EAEAEA; }
        .menu-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .menu-info { padding: 25px; }
        .menu-info h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 10px; color: #3E2723; }
        .menu-desc { font-size: 14px; color: #705446; line-height: 1.5; margin-bottom: 15px; }
        .menu-tag { display: inline-block; margin-bottom: 10px; padding: 4px 12px; background: #F5EBE0; border-radius: 12px; font-size: 12px; font-weight: 600; color: #3E2723; }

        /* Pricing Section */
        .pricing { background-color: #F5EBE0; padding: 100px 10%; }
        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 900px; margin: 0 auto; }
        .price-card { background: #FFF9F2; padding: 40px 30px; border-radius: 24px; text-align: center; position: relative; overflow: hidden; }
        .price-card.popular { border: 2px solid #E0A96D; background-color: #FFFFFF; box-shadow: 0 15px 35px rgba(62,39,35,0.08); }
        .ribbon { position: absolute; top: 15px; right: -35px; background: #E0A96D; color: #3E2723; font-weight: 700; font-size: 11px; padding: 4px 40px; transform: rotate(45deg); }
        .price-card h3 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 10px; }
        .size-info { font-size: 13px; color: #705446; margin-bottom: 15px; }
        .price-amount { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 800; color: #3E2723; margin-bottom: 20px; }
        .price-features { list-style: none; margin-bottom: 30px; text-align: left; display: inline-block; }
        .price-features li { margin-bottom: 10px; font-size: 14px; color: #5C4033; padding-left: 20px; position: relative; }
        .price-features li::before { content: "✓"; position: absolute; left: 0; color: #E0A96D; font-weight: bold; }

        /* Process Section */
        .process { background-color: #FFF9F2; padding: 100px 10%; text-align: center; }
        .steps-container { display: flex; justify-content: space-between; gap: 20px; max-width: 800px; margin: 0 auto; }
        .step { flex: 1; padding: 15px; }
        .step-num { width: 45px; height: 45px; background: #3E2723; color: #FFF9F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; margin: 0 auto 15px auto; }
        .step h3 { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 8px; }
        .step p { font-size: 13px; color: #705446; line-height: 1.4; }

        /* Testimonials Section */
        .testimonials { background-color: #F5EBE0; padding: 100px 10%; }
        .testi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .testi-card { background: #FFF9F2; padding: 25px; border-radius: 20px; text-align: left; }
        .stars { color: #E0A96D; margin-bottom: 10px; }
        .testi-card p { font-size: 14px; font-style: italic; color: #5C4033; margin-bottom: 15px; line-height: 1.5; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 40px; height: 40px; background: #3E2723; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }

        /* Order/WhatsApp Section */
        .whatsapp-section { background-color: #3E2723; color: #FFF9F2; text-align: center; padding: 100px 10%; }
        .whatsapp-section h2 { font-family: 'Playfair Display', serif; font-size: 42px; margin-bottom: 20px; }
        .whatsapp-section p { color: #D5C5BC; max-width: 600px; margin: 0 auto 35px auto; font-size: 16px; line-height: 1.6; }

        /* Footer */
        footer { background-color: #271714; color: #FFF9F2; text-align: center; padding: 40px; font-size: 14px; border-top: 1px solid rgba(255,259,242,0.05); }

        /* Responsive Breakpoints */
        @media (max-width: 991px) {
            nav { padding: 20px 5%; }
            .nav-links { display: none; }
            .hero { flex-direction: column-reverse; text-align: center; padding: 120px 5% 60px 5%; gap: 40px; }
            .hero-content h1 { font-size: 38px; }
            .product-highlight { flex-direction: column; padding: 60px 5%; text-align: center; }
            .menu-section { padding: 60px 20px; }
            .menu-grid { grid-template-columns: 1fr; gap: 25px; } /* Di HP otomatis ke bawah agar pas */
            .steps-container { flex-direction: column; gap: 30px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav>
        <a href="#home" class="logo">PureFudge.</a>
        <ul class="nav-links">
            <li><a href="#home">Beranda</a></li>
            <li><a href="#keunggulan">Keunggulan</a></li>
            <li><a href="#menu">Varian Topping</a></li>
            <li><a href="#harga">Paket Harga</a></li>
            <li><a href="#order" class="nav-cta">Pesan Sekarang</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Satu Gigitan, <br>Kemewahan Rasa yang <span>Lumer di Dalam</span></h1>
