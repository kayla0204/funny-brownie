<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureFudge - Premium Fudgy Brownie Bites</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Reset & Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #FFF9F2; color: #3E2723; scroll-behavior: smooth; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 10%; background-color: rgba(255, 249, 242, 0.95); position: fixed; width: 100%; top: 0; z-index: 100; backdrop-filter: blur(5px); border-bottom: 1px solid rgba(62, 39, 35, 0.05); }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 800; color: #3E2723; text-decoration: none; }
        .nav-links { list-style: none; display: flex; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: #3E2723; font-weight: 600; font-size: 15px; transition: 0.3s; }
        .nav-links a:hover { color: #E0A96D; }
        .nav-cta { background-color: #3E2723; color: #FFF9F2 !important; padding: 10px 20px; border-radius: 20px; }
        .nav-cta:hover { background-color: #E0A96D !important; color: #3E2723 !important; }

        /* Hero Section */
        .hero { display: flex; align-items: center; min-height: 100vh; padding: 120px 10% 80px 10%; gap: 50px; }
        .hero-content { flex: 1.2; }
        .badge { display: inline-block; padding: 6px 16px; background-color: rgba(224, 169, 109, 0.2); color: #B37D43; font-weight: 700; font-size: 12px; border-radius: 50px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .hero-content h1 { font-family: 'Playfair Display', serif; font-size: 56px; line-height: 1.2; margin-bottom: 20px; font-weight: 900; }
        .hero-content span { color: #E0A96D; position: relative; }
        .hero-content p { font-size: 16px; line-height: 1.7; margin-bottom: 35px; color: #5C4033; }
        .cta-group { display: flex; gap: 20px; align-items: center; }
        .cta-btn { display: inline-block; padding: 16px 35px; background-color: #3E2723; color: #FFF9F2; text-decoration: none; font-weight: 600; border-radius: 30px; transition: 0.3s; box-shadow: 0 4px 15px rgba(62,39,35,0.2); text-align: center; }
        .cta-btn:hover { background-color: #E0A96D; color: #3E2723; transform: translateY(-2px); }
        .secondary-btn { background-color: transparent; color: #3E2723; border: 2px solid #3E2723; box-shadow: none; }
        .secondary-btn:hover { background-color: rgba(62,39,35,0.05); color: #3E2723; }
        .hero-image { flex: 0.8; text-align: center; position: relative; }
        .hero-image img { max-width: 100%; height: auto; border-radius: 24px; box-shadow: 0 20px 40px rgba(62,39,35,0.15); }

        /* Section Global Settings */
        section { padding: 100px 10%; }
        .section-header { text-align: center; max-width: 600px; margin: 0 auto 60px auto; }
        .section-header h2 { font-family: 'Playfair Display', serif; font-size: 40px; color: #3E2723; margin-bottom: 15px; font-weight: 800; }
        .section-header p { color: #705446; font-size: 16px; line-height: 1.6; }

        /* Secret Recipe / Philosophy Section */
        .philosophy { background-color: #F5EBE0; display: flex; align-items: center; gap: 60px; }
        .philosophy-img { flex: 1; }
        .philosophy-img img { width: 100%; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); }
        .philosophy-text { flex: 1; }
        .philosophy-text h3 { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 20px; }
        .philosophy-text p { font-size: 16px; line-height: 1.7; color: #5C4033; margin-bottom: 20px; }

        /* Menu Section Grid */
        .menu-section { background-color: #FFF9F2; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .menu-card { background: #FFFFFF; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(62,39,35,0.03); transition: 0.3s; border: 1px solid rgba(62,39,35,0.02); text-align: center; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(62,39,35,0.08); }
        .menu-img-box { height: 240px; width: 100%; overflow: hidden; background-color: #EAEAEA; }
        .menu-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .menu-card:hover .menu-img-box img { transform: scale(1.05); }
        .menu-info { padding: 25px; }
        .menu-info h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 10px; color: #3E2723; }
        .menu-desc { font-size: 14px; color: #705446; line-height: 1.5; margin-bottom: 15px; height: 42px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-tag { inline-size: max-content; margin: 0 auto 15px auto; padding: 4px 12px; background: #F5EBE0; border-radius: 12px; font-size: 12px; font-weight: 600; color: #3E2723; }

        /* Pricing Section */
        .pricing { background-color: #F5EBE0; }
        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1000px; margin: 0 auto; }
        .price-card { background: #FFF9F2; padding: 40px 30px; border-radius: 24px; border: 2px solid transparent; position: relative; overflow: hidden; text-align: center; }
        .price-card.popular { border-color: #E0A96D; background-color: #FFFFFF; transform: scale(1.03); box-shadow: 0 15px 35px rgba(62,39,35,0.08); }
        .ribbon { position: absolute; top: 20px; right: -35px; background: #E0A96D; color: #3E2723; font-weight: 700; font-size: 12px; padding: 4px 40px; transform: rotate(45deg); }
        .price-card h3 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 10px; }
        .price-card .size-info { font-size: 14px; color: #705446; margin-bottom: 20px; }
        .price-amount { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 800; color: #3E2723; margin-bottom: 25px; }
        .price-features { list-style: none; margin-bottom: 35px; text-align: left; display: inline-block; }
        .price-features li { margin-bottom: 12px; font-size: 14px; color: #5C4033; position: relative; padding-left: 25px; }
        .price-features li::before { content: "✓"; position: absolute; left: 0; color: #E0A96D; font-weight: bold; }

        /* How to Order Process */
        .process { background-color: #FFF9F2; text-align: center; }
        .steps-container { display: flex; justify-content: space-between; gap: 30px; position: relative; max-width: 900px; margin: 0 auto; }
        .step { flex: 1; background: transparent; padding: 20px; }
        .step-num { width: 50px; height: 50px; background: #3E2723; color: #FFF9F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; margin: 0 auto 20px auto; border: 4px solid #F5EBE0; }
        .step:nth-child(even) .step-num { background: #E0A96D; color: #3E2723; }
        .step h3 { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 10px; }
        .step p { font-size: 14px; color: #705446; line-height: 1.5; }

        /* Testimonials Section */
        .testimonials { background-color: #F5EBE0; }
        .testi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .testi-card { background: #FFF9F2; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .stars { color: #E0A96D; margin-bottom: 15px; font-size: 18px; }
        .testi-card p { font-size: 14px; line-height: 1.6; color: #5C4033; font-style: italic; margin-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 45px; height: 45px; background: #3E2723; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .user-details h4 { font-size: 15px; font-weight: 700; color: #3E2723; }
        .user-details span { font-size: 12px; color: #A08070; }

        /* Footer */
        footer { background-color: #3E2723; color: #FFF9F2; padding: 60px 10% 30px 10%; }
        .footer-content { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 40px; margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid rgba(255,249,242,0.1); }
        .footer-brand h3 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 15px; color: #E0A96D; }
        .footer-brand p { font-size: 14px; color: #D5C5BC; max-width: 300px; line-height: 1.6; }
        .footer-links h4 { font-size: 16px; margin-bottom: 20px; letter-spacing: 0.5px; color: #FFF9F2; }
        .footer-links ul { list-style: none; }
        .footer-links ul li { margin-bottom: 12px; }
        .footer-links ul li a { text-decoration: none; color: #D5C5BC; font-size: 14px; transition: 0.3s; }
        .footer-links ul li a:hover { color: #E0A96D; padding-left: 5px; }
        .copyright { text-align: center; font-size: 13px; color: #A0867A; }

        /* Responsive Breakpoints */
        @media (max-width: 991px) {
            nav { padding: 20px 5%; }
            section { padding: 80px 5%; }
            .hero { flex-direction: column-reverse; text-align: center; padding: 120px 5% 60px 5%; gap: 40px; }
            .hero-content h1 { font-size: 42px; }
            .cta-group { justify-content: center; }
            .philosophy { flex-direction: column; text-align: center; gap: 40px; }
